name: Apply Havila TV UI fixes
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-havila-tv-channels
      - name: Apply UI fixes
        run: |
          echo ' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          git diff --check
      - name: Commit fixes
        run: |
          git config user.name HavilaLearning
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add HavilaTV/android/app/src/main/java/com/havila/tv/MainActivity.kt
          git commit -m "Apply Havila TV UI fixes"
          git push origin HEAD:fix-havila-tv-channels
