name: Havila TV UI fixes
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-havila-tv-channels
      - name: Apply search and settings fixes
        run: |
          python3 -c 'from pathlib import Path; p=Path("HavilaTV/android/app/src/main/java/com/havila/tv/MainActivity.kt"); s=p.read_text(); a="private const val FAVORITES_KEY = \"favorite_channel_ids\"\n"; b=a+"private const val AUTOPLAY_KEY = \"autoplay\"\nprivate const val LIVE_BADGE_KEY = \"show_live_badge\"\n"; assert s.count(a)==1; s=s.replace(a,b,1); a="val allChannels = remember { ChannelRepository.channels.filter(::hasPlayableSource) }"; b="val searchRequester = remember { FocusRequester() }\n    val allChannels = remember { ChannelRepository.channels.filter(::hasPlayableSource) }\n    LaunchedEffect(Unit) { awaitFrame(); awaitFrame(); runCatching { searchRequester.requestFocus() } }"; assert s.count(a)==1; s=s.replace(a,b,1); a="modifier = Modifier.fillMaxWidth(), singleLine = true, label = { Text(\"Nome do canal\") }"; b="modifier = Modifier.fillMaxWidth().focusRequester(searchRequester), singleLine = true, label = { Text(\"Nome do canal\") }"; assert s.count(a)==1; s=s.replace(a,b,1); a="var autoplay by remember { mutableStateOf(true) }"; b="val context = LocalContext.current\n    val prefs = remember { context.getSharedPreferences(PREFS, Context.MODE_PRIVATE) }\n    var autoplay by remember { mutableStateOf(prefs.getBoolean(AUTOPLAY_KEY, true)) }"; assert s.count(a)==1; s=s.replace(a,b,1); a="var showLiveBadge by remember { mutableStateOf(true) }"; b="var showLiveBadge by remember { mutableStateOf(prefs.getBoolean(LIVE_BADGE_KEY, true)) }"; assert s.count(a)==1; s=s.replace(a,b,1); a="SettingsRow(\"Reprodução automática\", \"Iniciar o canal imediatamente ao selecionar.\", autoplay) { autoplay = it }"; b="SettingsRow(\"Reprodução automática\", \"Iniciar o canal imediatamente ao selecionar.\", autoplay) { autoplay = it; prefs.edit().putBoolean(AUTOPLAY_KEY, it).apply() }"; assert s.count(a)==1; s=s.replace(a,b,1); a="SettingsRow(\"Indicador AO VIVO\", \"Mostrar o estado LIVE nos cartões dos canais.\", showLiveBadge) { showLiveBadge = it }"; b="SettingsRow(\"Indicador AO VIVO\", \"Mostrar o estado LIVE nos cartões dos canais.\", showLiveBadge) { showLiveBadge = it; prefs.edit().putBoolean(LIVE_BADGE_KEY, it).apply() }"; assert s.count(a)==1; p.write_text(s.replace(a,b,1))'
      - name: Improve favorite remote control
        run: |
          python3 -c 'from pathlib import Path; p=Path("HavilaTV/android/app/src/main/java/com/havila/tv/MainActivity.kt"); s=p.read_text(); a="IconButton(onClick = { FavoritesStore.toggle(context, channel.id) }, modifier = Modifier.size(38.dp)) { Icon(if (isFavorite) Icons.Default.Favorite else Icons.Default.FavoriteBorder, \"Favorito\", tint = if (isFavorite) LiveRed else White.copy(alpha = .72f)) }"; b="IconButton(onClick = { FavoritesStore.toggle(context, channel.id) }, modifier = Modifier.size(38.dp).onKeyEvent { e -> val k=e.nativeKeyEvent; if (k.action==android.view.KeyEvent.ACTION_DOWN && k.repeatCount==0 && (k.keyCode==android.view.KeyEvent.KEYCODE_DPAD_CENTER || k.keyCode==android.view.KeyEvent.KEYCODE_ENTER)) { FavoritesStore.toggle(context, channel.id); true } else false }) { Icon(if (isFavorite) Icons.Default.Favorite else Icons.Default.FavoriteBorder, \"Favorito\", tint = if (isFavorite) LiveRed else White.copy(alpha = .72f)) }"; assert s.count(a)==1; s=s.replace(a,b,1); a="IconButton(onClick = { FavoritesStore.toggle(context, channel.id) }, modifier = Modifier.size(40.dp)) { Icon(if (isFavorite) Icons.Default.Favorite else Icons.Default.FavoriteBorder, \"Favorito\", tint = if (isFavorite) LiveRed else White.copy(alpha = .72f)) }"; b="IconButton(onClick = { FavoritesStore.toggle(context, channel.id) }, modifier = Modifier.size(40.dp).onKeyEvent { e -> val k=e.nativeKeyEvent; if (k.action==android.view.KeyEvent.ACTION_DOWN && k.repeatCount==0 && (k.keyCode==android.view.KeyEvent.KEYCODE_DPAD_CENTER || k.keyCode==android.view.KeyEvent.KEYCODE_ENTER)) { FavoritesStore.toggle(context, channel.id); true } else false }) { Icon(if (isFavorite) Icons.Default.Favorite else Icons.Default.FavoriteBorder, \"Favorito\", tint = if (isFavorite) LiveRed else White.copy(alpha = .72f)) }"; assert s.count(a)==1; p.write_text(s.replace(a,b,1))'
      - name: Scope category backgrounds
        run: |
          python3 -c 'from pathlib import Path; p=Path("HavilaTV/android/app/src/main/java/com/havila/tv/MainActivity.kt"); s=p.read_text(); a="    Box(Modifier.fillMaxSize().clip(RoundedCornerShape(14.dp))) {"; b="    Column(Modifier.fillMaxSize().padding(start = 20.dp, top = 8.dp, bottom = 10.dp)) {"; assert s.count(a)==1; s=s.replace(a,b,1); a="        Crossfade(targetState = backgrounds[backgroundIndex], animationSpec = tween(1100), label = \"category-background\") { res -> Image(painter = painterResource(id = res), contentDescription = \"${category.name} background\", contentScale = ContentScale.Crop, modifier = Modifier.fillMaxSize()) }\n        Box(Modifier.fillMaxSize().background(Brush.verticalGradient(listOf(Bg.copy(alpha = .70f), Bg.copy(alpha = .55f), Bg.copy(alpha = .82f)))))\n        Column(Modifier.fillMaxSize().padding(start = 20.dp, top = 8.dp, bottom = 10.dp)) {"; b="        Spacer(Modifier.height(8.dp))\n        Box(Modifier.fillMaxWidth().weight(1f).clip(RoundedCornerShape(14.dp))) {\n            Crossfade(targetState = backgrounds[backgroundIndex], animationSpec = tween(1100), label = \"category-background\") { res -> Image(painter = painterResource(id = res), contentDescription = \"${category.name} background\", contentScale = ContentScale.Crop, modifier = Modifier.fillMaxSize()) }\n            Box(Modifier.fillMaxSize().background(Brush.verticalGradient(listOf(Bg.copy(alpha = .70f), Bg.copy(alpha = .55f), Bg.copy(alpha = .82f)))))\n            Column(Modifier.fillMaxSize().padding(start = 20.dp, top = 8.dp, bottom = 10.dp)) {"; assert s.count(a)==1; p.write_text(s.replace(a,b,1))'
      - name: Validate and commit
        run: |
          git diff --check
          git diff --stat
          git config user.name HavilaLearning
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add HavilaTV/android/app/src/main/java/com/havila/tv/MainActivity.kt
          git commit -m "Fix Havila TV search favorites settings and category scope"
          git push origin HEAD:fix-havila-tv-channels
