name: Havila TV Demo Pages

on:
  push:
    branches: ["fix-havila-tv-channels"]
    paths:
      - "HavilaTV/demo/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload demo
        uses: actions/upload-pages-artifact@v3
        with:
          path: HavilaTV/demo
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
