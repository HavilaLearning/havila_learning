name: Havila TV — Repair, Validate & Build

on:
  push:
    branches:
      - fix-havila-tv-channels
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-validate-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix-havila-tv-channels
          fetch-depth: 1

      - name: Ensure category logos and five-image carousel assets
        shell: python
        run: |
          from pathlib import Path
          d=Path("HavilaTV/android/app/src/main/res/drawable-nodpi"); d.mkdir(parents=True,exist_ok=True)
          cats={
            "noticias":("#1E5A78","M40,22h80v56H40z M50,32h48v7H50z M50,47h60v7H50z M50,62h42v7H50z"),
            "desporto":("#24734B","M80,18L98,40 122,44 104,62 108,86 80,74 52,86 56,62 38,44 62,40z"),
            "gospel":("#6B4A9A","M70,16h20v27h27v14H90v27H70V57H43V43h27z"),
            "filmes":("#8A3E49","M36,24h88v52H36z M48,24l12,26-12,26 M72,24l12,26-12,26 M96,24l12,26-12,26"),
            "musica":("#2E7180","M88,18v45c-4,-3-9,-5-14,-5-13,0-22,8-22,18s9,18 22,18 22,-8 22,-18V33l32,-8v35c-4,-3-9,-5-14,-5-13,0-22,8-22,18s9,18 22,18 22,-8 22,-18V18z"),
            "havila_kids":("#9A7426","M80,18c-18,0-32,14-32,32s14,32 32,32 32,-14 32,-32S98,18 80,18z M68,46h4 M88,46h4 M68,60c8,7 16,7 24,0"),
            "familia":("#6B5630","M80,18c-7,0-12,5-12,12s5,12 12,12 12,-5 12,-12-5,-12-12,-12z M54,31c-6,0-10,4-10,10s4,10 10,10 10,-4 10,-10-4,-10-10,-10z M106,31c-6,0-10,4-10,10s4,10 10,10 10,-4 10,-10-4,-10-10,-10z M58,82V66c0,-12 9,-20 22,-20s22,8 22,20v16z M34,82V70c0,-9 7,-16 16,-16 6,0 11,3 14,8v20z M96,62c3,-5 8,-8 14,-8 9,0 16,7 16,16v12z")
          }
          for n,(bg,shape) in cats.items():
            (d/f"{n}.xml").write_text(f'''<?xml version="1.0" encoding="utf-8"?>\n<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="160dp" android:height="100dp" android:viewportWidth="160" android:viewportHeight="100"><path android:fillColor="{bg}" android:pathData="M0,0h160v100H0z"/><path android:fillColor="#FFFFFF" android:pathData="{shape[1:] if shape.startswith('M') else shape}"/></vector>\n''',encoding="utf-8")
          palettes={"noticias":["#081D2B","#123A52","#1E5A78","#0D3146","#204C63"],"desporto":["#0A2518","#174C31","#24734B","#123D2A","#2B6A49"],"gospel":["#1C1230","#3A2460","#6B4A9A","#2A1C48","#584078"],"filmes":["#241014","#4A2027","#8A3E49","#34191F","#6E303A"],"musica":["#0A2830","#1A4B56","#2E7180","#123C47","#3A7F8B"],"havila_kids":["#3A2608","#674710","#9A7426","#5A3C0C","#B18A38"],"familia":["#251D11","#49391F","#6B5630","#3A2E19","#806A3D"]}
          for cat,colors in palettes.items():
            for i,bg in enumerate(colors,1):
              a=["#F2C14E","#FFFFFF","#D9A441","#9ED7FF","#FFD76A"][i-1]
              paths=[f"M0,0h1600v900H0z",f"M0,760 Q300,560 600,760 T1200,740 T1600,760 V900 H0z",f"M1050,80 L1450,300 L1250,520 L900,280z",f"M120,180 L520,180 L430,260 L120,260z"]
              if cat=="gospel": paths.append("M760,100h80v260h260v80H840v260h-80V440H500v-80h260z")
              if cat=="filmes": paths.append("M1080,180 L1420,380 L1080,580z")
              if cat=="musica": paths.append("M220,700h70V360h200v70H360v270z M520,620h70V260h200v70H660v290z")
              if cat=="havila_kids": paths.append("M180,250 L260,120 L340,250 L500,210 L400,340 L500,470 L340,430 L260,560 L180,430 L20,470 L120,340 L20,210z")
              if cat=="desporto": paths.append("M980,600 L1160,420 L1340,600 L1160,780z")
              if cat=="familia": paths.append("M600,650 Q800,420 1000,650 L1000,760 L600,760z")
              p=d/f"{cat}_{i:02d}.xml"
              p.write_text(f'''<?xml version="1.0" encoding="utf-8"?>\n<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="1600dp" android:height="900dp" android:viewportWidth="1600" android:viewportHeight="900"><path android:fillColor="{bg}" android:pathData="{paths[0]}"/><path android:fillColor="{a}" android:fillAlpha="0.15" android:pathData="{paths[1]}"/><path android:fillColor="{a}" android:fillAlpha="0.12" android:pathData="{paths[2]}"/><path android:fillColor="{a}" android:fillAlpha="0.10" android:pathData="{paths[3]}"/>{''.join(f'<path android:fillColor="{a}" android:fillAlpha="0.12" android:pathData="{x}"/>' for x in paths[4:])}</vector>\n''',encoding="utf-8")
          print("Category logos: 7; category carousel backgrounds: 7 x 5 = 35")

      - name: Repair duplicate channel IDs and connect category logo fallback
        shell: python
        run: |
          from pathlib import Path
          import re
          repo=Path("HavilaTV/android/app/src/main/java/com/havila/tv/ChannelRepository.kt"); main=Path("HavilaTV/android/app/src/main/java/com/havila/tv/MainActivity.kt")
          s=repo.read_text(encoding="utf-8"); entry_re=re.compile(r'^(\s*c\(\s*")([^"]+)("\s*,.*)$',re.M); seen=set(); counters={}; duplicates=[]
          def repair(m):
            pre,cid,suf=m.groups()
            if cid not in seen: seen.add(cid); counters[cid]=1; return m.group(0)
            counters[cid]=counters.get(cid,1)+1; nid=f"{cid}-{counters[cid]}"
            while nid in seen: counters[cid]+=1; nid=f"{cid}-{counters[cid]}"
            seen.add(nid); duplicates.append((cid,nid)); return pre+nid+suf
          repo.write_text(entry_re.sub(repair,s),encoding="utf-8")
          mt=main.read_text(encoding="utf-8")
          old='else -> Text(channelInitials(channel.name), color = White, fontSize = 22.sp, fontWeight = FontWeight.ExtraBold)'
          new='''else -> {\n                val categoryLogo = categoryDefinitions.firstOrNull { it.name.equals(channel.category, ignoreCase = true) }?.logoRes\n                if (categoryLogo != null) {\n                    Image(painter = painterResource(id = categoryLogo), contentDescription = channel.category, modifier = Modifier.fillMaxSize().padding(8.dp), contentScale = ContentScale.Fit)\n                } else {\n                    Text(channelInitials(channel.name), color = White, fontSize = 22.sp, fontWeight = FontWeight.ExtraBold)\n                }\n            }'''
          if old in mt: mt=mt.replace(old,new,1)
          elif "categoryDefinitions.firstOrNull { it.name.equals(channel.category, ignoreCase = true) }?.logoRes" not in mt: raise SystemExit("Channel logo rendering block not found")
          main.write_text(mt,encoding="utf-8")
          print(f"Duplicate ID repairs applied: {len(duplicates)}")
          for a,b in duplicates: print(f"  {a} -> {b}")

      - name: Validate complete catalogue and category artwork
        shell: python
        run: |
          from pathlib import Path
          import re,unicodedata
          repo=Path("HavilaTV/android/app/src/main/java/com/havila/tv/ChannelRepository.kt"); main=Path("HavilaTV/android/app/src/main/java/com/havila/tv/MainActivity.kt"); support=Path("HavilaTV/android/app/src/main/java/com/havila/tv/TvUiSupport.kt")
          s=repo.read_text(encoding="utf-8"); m=main.read_text(encoding="utf-8"); t=support.read_text(encoding="utf-8")
          e=re.findall(r'^\s*c\(\s*"([^"]+)"\s*,\s*"([^"]*)"\s*,\s*"([^"]*)"\s*,\s*"([^"]*)"\s*,\s*"([^"]*)"\s*(?:,\s*"([^"]*)")?\s*\)',s,re.M)
          if not e: raise SystemExit("No canonical channel entries found")
          ids=[x[0] for x in e]; names=[x[1] for x in e]; streams=[x[4] for x in e]; logos=[x[5] for x in e]; dup=sorted({x for x in ids if ids.count(x)>1})
          required=["Notícias","Desporto","Gospel","Filmes","Música","Havila Kids","Família"]
          def stem(n):
            n=unicodedata.normalize("NFKD",n); return "".join(c for c in n if not unicodedata.combining(c)).lower().replace(" ","_")
          cs=m.index("private fun CategoryContent"); ss=m.index("@Composable private fun SectionTitle",cs); cb=m[cs:ss]
          if "Crossfade(targetState = backgrounds[backgroundIndex]" not in cb: raise SystemExit("Category background carousel is not rendered inside CategoryContent")
          if "Hero(" in cb: raise SystemExit("Home Hero/background must remain outside CategoryContent")
          bb=m[m.index("private fun categoryBackgrounds"):]
          for cat in required:
            x=re.search(rf'"{re.escape(cat)}"\s*->\s*listOf\(([^)]*)\)',bb)
            if not x: raise SystemExit(f"Missing category background binding: {cat}")
            rs=re.findall(r"R\.drawable\.([A-Za-z0-9_]+)",x.group(1)); exp=[f"{stem(cat)}_{i:02d}" for i in range(1,6)]
            if rs!=exp: raise SystemExit(f"Category {cat} backgrounds invalid: {rs}; expected {exp}")
            for r in exp:
              if not (Path("HavilaTV/android/app/src/main/res/drawable-nodpi")/f"{r}.xml").is_file(): raise SystemExit(f"Missing background resource: {r}")
            if not (Path("HavilaTV/android/app/src/main/res/drawable-nodpi")/f"{stem(cat)}.xml").is_file(): raise SystemExit(f"Missing category logo resource: {stem(cat)}")
          defs=t[t.index("val categoryDefinitions = listOf("):]
          for cat in required:
            x=re.search(rf'CategoryDef\("{re.escape(cat)}".*?R\.drawable\.([A-Za-z0-9_]+)\)',defs,re.S)
            if not x or x.group(1)!=stem(cat): raise SystemExit(f"Invalid category logo binding: {cat}")
          if "categoryDefinitions.firstOrNull { it.name.equals(channel.category, ignoreCase = true) }?.logoRes" not in m: raise SystemExit("Channel category-logo fallback is not connected")
          print(f"Complete catalog entries: {len(e)}"); print(f"Unique channel IDs: {len(set(ids))}"); print(f"Entries with stream URL: {sum(bool(x.strip()) for x in streams)}"); print(f"Entries with direct logo URL: {sum(bool(x.strip()) for x in logos)}"); print(f"Entries using category-logo fallback: {sum(not bool(x.strip()) for x in logos)}"); print("Category logos: 7/7 dedicated"); print("Category carousels: 7/7 with exactly 5 dedicated images"); print("Home background: independent and preserved")
          if dup: raise SystemExit("Duplicate IDs remain: "+", ".join(dup))
          if any(not x.strip() for x in names): raise SystemExit("Blank channel name found")
          if any(not x.strip() for x in streams): raise SystemExit("Missing stream URL")

      - name: Commit repairs and category artwork if source changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HavilaTV/android/app/src/main/java/com/havila/tv/ChannelRepository.kt HavilaTV/android/app/src/main/java/com/havila/tv/MainActivity.kt HavilaTV/android/app/src/main/res/drawable-nodpi
          if git diff --cached --quiet; then echo "No source or artwork repairs required."; else git commit -m "Consolidate Havila TV category artwork and channel repairs"; git push origin HEAD:fix-havila-tv-channels; fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify Android project
        working-directory: HavilaTV/android
        run: |
          test -f ./settings.gradle.kts
          test -f ./build.gradle.kts
          test -f ./app/build.gradle.kts
          test -f ./app/src/main/java/com/havila/tv/MainActivity.kt
          test -f ./app/src/main/java/com/havila/tv/PlayerActivity.kt
          test -f ./app/src/main/java/com/havila/tv/ChannelRepository.kt

      - name: Install Gradle 8.13
        working-directory: .
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Build complete debug APK
        working-directory: HavilaTV/android
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Verify APK exists
        working-directory: HavilaTV/android
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload complete APK
        uses: actions/upload-artifact@v4
        with:
          name: HavilaTV-complete-debug-apk
          path: HavilaTV/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30