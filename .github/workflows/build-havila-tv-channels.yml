name: Build Havila TV Channels Fix

on:
  push:
    branches:
      - fix-havila-tv-channels
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HavilaTV/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify project files
        run: |
          test -f ./settings.gradle.kts
          test -f ./build.gradle.kts
          test -f ./app/build.gradle.kts
          test -f ./app/src/main/java/com/havila/tv/MainActivity.kt
          test -f ./app/src/main/java/com/havila/tv/PlayerActivity.kt
          test -f ./app/src/main/java/com/havila/tv/ChannelRepository.kt

      - name: Apply category background scope fix for build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/havila/tv/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          start = s.index('@Composable\nprivate fun CategoryContent(')
          end = s.index('\n@Composable\nprivate fun SectionTitle', start)
          old = s[start:end]
          if 'CATEGORY_BACKGROUND_SCOPE_V2' in old:
              print('Category background scope fix already present.')
              raise SystemExit(0)
          new = '''@Composable\nprivate fun CategoryContent(context: Context, menuRequester: FocusRequester, initialCategoryIndex: Int) {\n    var selectedCategoryIndex by remember(initialCategoryIndex) { mutableStateOf(initialCategoryIndex.coerceIn(0, categoryDefinitions.lastIndex)) }\n    var selectedSubcategory by remember(selectedCategoryIndex) { mutableStateOf(categoryDefinitions[selectedCategoryIndex].subcategories.first()) }\n    val category = categoryDefinitions[selectedCategoryIndex]\n    val channels = remember(category.name, selectedSubcategory) { channelsFor(category.name, selectedSubcategory) }\n    val firstChannelRequester = remember(category.name, selectedSubcategory) { FocusRequester() }\n    LaunchedEffect(category.name, selectedSubcategory, channels) { awaitFrame(); awaitFrame(); runCatching { if (channels.isNotEmpty()) firstChannelRequester.requestFocus() } }\n\n    var backgroundIndex by remember(category.name) { mutableStateOf(0) }\n    val backgrounds = categoryBackgrounds(category)\n    LaunchedEffect(category.name) { while (true) { kotlinx.coroutines.delay(5_000); backgroundIndex = (backgroundIndex + 1) % backgrounds.size } }\n\n    // CATEGORY_BACKGROUND_SCOPE_V2: the Home/header and category carousel remain above the background.\n    Column(Modifier.fillMaxSize().clip(RoundedCornerShape(14.dp))) {\n        Row(Modifier.fillMaxWidth().padding(start = 20.dp, top = 8.dp, end = 20.dp), verticalAlignment = Alignment.CenterVertically) {\n            SectionTitle(category.name.uppercase()); Spacer(Modifier.width(10.dp)); Text("Escolha uma área", color = White.copy(alpha = .78f), fontSize = 12.sp); Spacer(Modifier.weight(1f))\n            Row(horizontalArrangement = Arrangement.spacedBy(4.dp)) { backgrounds.forEachIndexed { index, _ -> Box(Modifier.width(if (index == backgroundIndex) 16.dp else 5.dp).height(5.dp).clip(RoundedCornerShape(50)).background(if (index == backgroundIndex) FocusGold else White.copy(alpha = .45f))) } }\n        }\n        LazyRow(Modifier.fillMaxWidth().focusGroup().padding(start = 20.dp), horizontalArrangement = Arrangement.spacedBy(10.dp), contentPadding = PaddingValues(end = 20.dp)) { itemsIndexed(categoryDefinitions, key = { _, item -> item.name }) { index, item -> CategoryCard(item, index == selectedCategoryIndex, { selectedCategoryIndex = index; selectedSubcategory = item.subcategories.first() }, menuRequester) } }\n\n        Box(Modifier.fillMaxWidth().weight(1f).clip(RoundedCornerShape(14.dp, 14.dp, 0.dp, 0.dp))) {\n            Crossfade(targetState = backgrounds[backgroundIndex], animationSpec = tween(1100), label = "category-background") { res -> Image(painter = painterResource(id = res), contentDescription = "${category.name} background", contentScale = ContentScale.Crop, modifier = Modifier.fillMaxSize()) }\n            Box(Modifier.fillMaxSize().background(Brush.verticalGradient(listOf(Bg.copy(alpha = .70f), Bg.copy(alpha = .55f), Bg.copy(alpha = .82f)))))\n            Column(Modifier.fillMaxSize().padding(start = 20.dp, top = 8.dp, bottom = 10.dp)) {\n                Row(verticalAlignment = Alignment.CenterVertically) { SectionTitle("SUB-CATEGORIAS"); Spacer(Modifier.width(10.dp)); Text(category.name, color = FocusGold, fontSize = 12.sp, fontWeight = FontWeight.Bold) }\n                LazyRow(Modifier.fillMaxWidth().focusGroup(), horizontalArrangement = Arrangement.spacedBy(8.dp), contentPadding = PaddingValues(end = 20.dp)) { items(category.subcategories, key = { it }) { sub -> SubcategoryChip(displaySubcategory(sub), sub == selectedSubcategory) { selectedSubcategory = sub } } }\n                Spacer(Modifier.height(6.dp))\n                Row(verticalAlignment = Alignment.CenterVertically) { SectionTitle("CANAIS"); Spacer(Modifier.width(10.dp)); Text("${category.name} • ${displaySubcategory(selectedSubcategory)}", color = White.copy(alpha = .80f), fontSize = 12.sp, maxLines = 1); Spacer(Modifier.weight(1f)); Text("${channels.size} disponíveis", color = White.copy(alpha = .72f), fontSize = 11.sp) }\n                Spacer(Modifier.height(2.dp))\n                if (channels.isEmpty()) {\n                    Box(Modifier.fillMaxWidth().height(70.dp).padding(end = 20.dp).clip(RoundedCornerShape(12.dp)).background(Surface.copy(alpha = .88f)), contentAlignment = Alignment.CenterStart) { Text("Nenhum canal com fonte disponível nesta subcategoria.", color = White.copy(alpha = .78f), fontSize = 13.sp, modifier = Modifier.padding(horizontal = 16.dp), maxLines = 2) }\n                } else {\n                    LazyVerticalGrid(columns = GridCells.Adaptive(minSize = 190.dp), modifier = Modifier.fillMaxWidth().weight(1f).focusGroup(), contentPadding = PaddingValues(top = 2.dp, bottom = 20.dp, end = 20.dp), horizontalArrangement = Arrangement.spacedBy(10.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) { items(channels, key = { it.id }) { channel -> ChannelGridCard(channel, context, firstChannelRequester, channel.id == channels.firstOrNull()?.id) } }\n                }\n            }\n        }\n    }\n}\n'''
          p.write_text(s[:start] + new + s[end:], encoding='utf-8')
          PY

      - name: Install Gradle 8.13
        working-directory: .
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Build complete debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Verify APK exists
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload complete APK
        uses: actions/upload-artifact@v4
        with:
          name: HavilaTV-complete-debug-apk
          path: HavilaTV/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
