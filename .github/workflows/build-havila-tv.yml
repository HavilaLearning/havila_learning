name: Build Havila TV APK

on:
  push:
    branches:
      - havila-tv-stage1
      - havila-tv-mockup-dashboard
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HavilaTV/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify launcher icon assets
        working-directory: .
        run: |
          test -f HavilaTV/android/app/src/main/res/drawable/havila_tv_icon.xml
          test ! -f HavilaTV/android/app/src/main/res/drawable/havila_tv_icon.png
          test ! -f HavilaTV/android/app/src/main/res/drawable-nodpi/havila_tv_icon.png
          echo "Launcher icon uses a valid vector drawable; no broken PNG is referenced."

      - name: Install Gradle 8.13
        working-directory: .
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Normalize catalog Kotlin URL literals
        working-directory: .
        run: |
          set -euo pipefail
          file="HavilaTV/android/app/src/main/java/com/havila/tv/ChannelRepository.kt"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("HavilaTV/android/app/src/main/java/com/havila/tv/ChannelRepository.kt")
          s = p.read_text()
          old = 'LIVE$BFM_BUSINESS/index.m3u8?end=END&start=LIVE'
          new = 'LIVE\\$BFM_BUSINESS/index.m3u8?end=END&start=LIVE'
          if old in s:
              p.write_text(s.replace(old, new, 1))
              print("Normalized BFM Business Kotlin URL literal.")
          else:
              print("BFM Business URL already normalized; no change needed.")
          PY

      - name: Build signed debug APK for TV testing
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Verify APK exists
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload signed debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HavilaTV-debug-apk
          path: HavilaTV/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
