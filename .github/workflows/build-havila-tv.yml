name: Build Havila TV APK

on:
  push:
    branches:
      - havila-tv-stage1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HavilaTV/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Normalize approved Havila TV icon PNG
        working-directory: .
        run: |
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Path('HavilaTV/android/app/src/main/res/drawable-nodpi/havila_tv_icon.png')
          mirror = Path('HavilaTV/android/app/src/main/res/drawable/havila_tv_icon.png')

          image = Image.open(source).convert('RGBA')
          image.save(source, format='PNG', optimize=False)
          image.save(mirror, format='PNG', optimize=False)
          print(f'Normalized approved icon: {source} -> {image.size} RGBA PNG')
          PY

          git config user.name 'HavilaLearning'
          git config user.email 'actions@users.noreply.github.com'
          git add HavilaTV/android/app/src/main/res/drawable-nodpi/havila_tv_icon.png HavilaTV/android/app/src/main/res/drawable/havila_tv_icon.png
          if ! git diff --cached --quiet; then
            git commit -m 'Fix approved Havila TV icon PNG encoding [skip ci]'
            git push origin HEAD:havila-tv-stage1
          fi

      - name: Install Gradle 8.13
        working-directory: .
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Build release APK
        run: gradle --no-daemon assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: HavilaTV-release-apk
          path: HavilaTV/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
