name: Build Havila TV APK

on:
  push:
    branches:
      - havila-tv-stage1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HavilaTV/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Repair approved Havila TV icon PNG
        working-directory: .
        run: |
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          # Use the valid drawable copy as the source and rebuild the nodpi PNG.
          source = Path('HavilaTV/android/app/src/main/res/drawable/havila_tv_icon.png')
          target = Path('HavilaTV/android/app/src/main/res/drawable-nodpi/havila_tv_icon.png')

          with Image.open(source) as image:
              image.load()
              normalized = image.convert('RGBA')
              normalized.save(target, format='PNG', optimize=False)
              print(f'Repaired approved icon: {source} -> {target}; size={normalized.size}, mode={normalized.mode}')

          with Image.open(target) as check:
              check.load()
              print(f'PNG verification OK: {target}; size={check.size}, mode={check.mode}')
          PY

          git config user.name 'HavilaLearning'
          git config user.email 'actions@users.noreply.github.com'
          git add HavilaTV/android/app/src/main/res/drawable-nodpi/havila_tv_icon.png
          if ! git diff --cached --quiet; then
            git commit -m 'Repair approved Havila TV icon PNG [skip ci]'
            git push origin HEAD:havila-tv-stage1
          fi

      - name: Install Gradle 8.13
        working-directory: .
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Build release APK
        run: gradle --no-daemon assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: HavilaTV-release-apk
          path: HavilaTV/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
