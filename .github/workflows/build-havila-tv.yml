name: Build Havila TV APK

on:
  push:
    branches:
      - havila-tv-stage1
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HavilaTV
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HavilaTV-debug-apk
          path: HavilaTV/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
