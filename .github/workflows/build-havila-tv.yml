name: Build Havila TV APK

on:
  push:
    branches:
      - havila-tv-stage1
      - havila-tv-mockup-dashboard
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HavilaTV/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify launcher icon assets
        working-directory: .
        run: |
          test -f HavilaTV/android/app/src/main/res/drawable/havila_tv_icon.xml
          test ! -f HavilaTV/android/app/src/main/res/drawable/havila_tv_icon.png
          test ! -f HavilaTV/android/app/src/main/res/drawable-nodpi/havila_tv_icon.png
          echo "Launcher icon uses a valid vector drawable; no broken PNG is referenced."

      - name: Install Gradle 8.13
        working-directory: .
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Build release APK
        run: gradle --no-daemon assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: HavilaTV-release-apk
          path: HavilaTV/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
