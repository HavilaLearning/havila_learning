name: Repair Havila TV IDs and logo handling

on:
  workflow_dispatch:
  push:
    branches: [fix-havila-tv-channels]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HavilaTV/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix-havila-tv-channels
          fetch-depth: 0

      - name: Repair duplicate channel IDs and category logo mapping
        shell: python
        run: |
          from pathlib import Path
          import re
          catalog = Path("app/src/main/java/com/havila/tv/ChannelRepository.kt")
          lines = catalog.read_text(encoding="utf-8").splitlines(keepends=True)
          seen = set(); counts = {}
          pattern = re.compile(r'^(\s*c\(\s*")([^"]+)("\s*,)')
          for i, line in enumerate(lines):
              m = pattern.match(line)
              if not m: continue
              original = m.group(2); candidate = original
              if candidate in seen:
                  n = counts.get(original, 1) + 1
                  candidate = f"{original}-{n}"
                  while candidate in seen:
                      n += 1; candidate = f"{original}-{n}"
                  lines[i] = line[:m.start(2)] + candidate + line[m.end(2):]
                  print(f"Repaired duplicate ID: {original} -> {candidate}")
              counts[original] = counts.get(original, 1) + 1
              seen.add(candidate)
          catalog.write_text("".join(lines), encoding="utf-8")

          main = Path("app/src/main/java/com/havila/tv/MainActivity.kt")
          s = main.read_text(encoding="utf-8")
          old_logo = '''        when {
            local != null -> Image(painter = painterResource(id = local), contentDescription = channel.name, modifier = Modifier.fillMaxSize().padding(8.dp), contentScale = ContentScale.Fit)
            !channel.logoUrl.isNullOrBlank() && !failed -> AsyncImage(model = channel.logoUrl, contentDescription = channel.name, modifier = Modifier.fillMaxSize().padding(8.dp), contentScale = ContentScale.Fit, onError = { failed = true })
            else -> Text(channelInitials(channel.name), color = White, fontSize = 22.sp, fontWeight = FontWeight.ExtraBold)
        }'''
          new_logo = '''        when {
            local != null -> Image(painter = painterResource(id = local), contentDescription = channel.name, modifier = Modifier.fillMaxSize().padding(8.dp), contentScale = ContentScale.Fit)
            !channel.logoUrl.isNullOrBlank() && !failed -> AsyncImage(model = channel.logoUrl, contentDescription = channel.name, modifier = Modifier.fillMaxSize().padding(8.dp), contentScale = ContentScale.Fit, onError = { failed = true })
            categoryDefinitions.firstOrNull { it.name.equals(channel.category, ignoreCase = true) }?.logoRes != null -> Image(painter = painterResource(id = categoryDefinitions.first { it.name.equals(channel.category, ignoreCase = true) }.logoRes), contentDescription = channel.category, modifier = Modifier.fillMaxSize().padding(8.dp), contentScale = ContentScale.Fit)
            else -> Text(channelInitials(channel.name), color = White, fontSize = 22.sp, fontWeight = FontWeight.ExtraBold)
        }'''
          if old_logo in s:
              s = s.replace(old_logo, new_logo, 1)
              print("ChannelLogo category fallback connected.")
          elif "categoryDefinitions.firstOrNull { it.name.equals(channel.category, ignoreCase = true) }?.logoRes" in s:
              print("ChannelLogo category fallback already connected.")
          else:
              raise SystemExit("ChannelLogo source not found")
          main.write_text(s, encoding="utf-8")

      - name: Validate repaired source before committing
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path("app/src/main/java/com/havila/tv/ChannelRepository.kt")
          s = p.read_text(encoding="utf-8")
          entries = re.findall(r'^\s*c\(\s*"([^"]+)"\s*,\s*"([^"]*)"\s*,\s*"([^"]*)"\s*,\s*"([^"]*)"\s*,\s*"([^"]*)"\s*(?:,\s*"([^"]*)")?\s*\)', s, re.M)
          ids = [x[0] for x in entries]; names = [x[1] for x in entries]; streams = [x[4] for x in entries]; logos = [x[5] for x in entries]
          duplicates = sorted({x for x in ids if ids.count(x) > 1})
          print(f"Complete catalog entries found: {len(entries)}")
          print(f"Unique channel IDs: {len(set(ids))}")
          print(f"Entries with stream URL: {sum(bool(x.strip()) for x in streams)}")
          print(f"Entries with direct logo URL: {sum(bool(x.strip()) for x in logos)}")
          print(f"Entries using category-logo fallback: {sum(not x.strip() for x in logos)}")
          print(f"Duplicate IDs: {duplicates}")
          if not entries or duplicates or any(not x.strip() for x in names) or any(not x.strip() for x in streams):
              raise SystemExit("Catalog validation failed")

      - name: Commit repaired source BEFORE build
        run: |
          git diff --check
          git config user.name HavilaLearning
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/havila/tv/ChannelRepository.kt app/src/main/java/com/havila/tv/MainActivity.kt
          if git diff --cached --quiet; then echo "No source changes to commit."; else git commit -m "Fix Havila TV channel IDs and category logos"; git push origin HEAD:fix-havila-tv-channels; fi

      - name: Install Gradle 8.13
        working-directory: .
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Compile repaired APK
        run: |
          gradle --version
          gradle --no-daemon assembleDebug --stacktrace

      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload repaired APK
        uses: actions/upload-artifact@v4
        with:
          name: HavilaTV-repaired-ids-logos-debug-apk
          path: HavilaTV/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
