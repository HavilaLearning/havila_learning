name: Fix category background scope v2

on:
  push:
    branches:
      - fix-havila-tv-channels
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HavilaTV/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix-havila-tv-channels
          fetch-depth: 0

      - name: Apply category background scope fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/java/com/havila/tv/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          pattern = r'@Composable\s+private fun CategoryContent\(context: Context, menuRequester: FocusRequester, initialCategoryIndex: Int\) \{.*?\n\}\n\n@Composable\s+private fun SectionTitle'
          m = re.search(pattern, s, flags=re.S)
          if not m:
              print('CategoryContent block not found; keeping current source unchanged.')
              raise SystemExit(0)

          new_function = '''@Composable
private fun CategoryContent(context: Context, menuRequester: FocusRequester, initialCategoryIndex: Int) {
    var selectedCategoryIndex by remember(initialCategoryIndex) { mutableStateOf(initialCategoryIndex.coerceIn(0, categoryDefinitions.lastIndex)) }
    var selectedSubcategory by remember(selectedCategoryIndex) { mutableStateOf(categoryDefinitions[selectedCategoryIndex].subcategories.first()) }
    val category = categoryDefinitions[selectedCategoryIndex]
    val channels = remember(category.name, selectedSubcategory) { channelsFor(category.name, selectedSubcategory) }
    val firstChannelRequester = remember(category.name, selectedSubcategory) { FocusRequester() }
    LaunchedEffect(category.name, selectedSubcategory, channels) {
        awaitFrame(); awaitFrame()
        runCatching { if (channels.isNotEmpty()) firstChannelRequester.requestFocus() }
    }

    var backgroundIndex by remember(category.name) { mutableStateOf(0) }
    val backgrounds = categoryBackgrounds(category)
    LaunchedEffect(category.name) {
        while (true) {
            kotlinx.coroutines.delay(5_000)
            backgroundIndex = (backgroundIndex + 1) % backgrounds.size
        }
    }

    Column(Modifier.fillMaxSize().clip(RoundedCornerShape(14.dp))) {
        Row(
            Modifier.fillMaxWidth().padding(start = 20.dp, top = 8.dp, end = 20.dp),
            verticalAlignment = Alignment.CenterVertically
        ) {
            SectionTitle(category.name.uppercase())
            Spacer(Modifier.width(10.dp))
            Text("Escolha uma área", color = White.copy(alpha = .78f), fontSize = 12.sp)
            Spacer(Modifier.weight(1f))
            Row(horizontalArrangement = Arrangement.spacedBy(4.dp)) {
                backgrounds.forEachIndexed { index, _ ->
                    Box(Modifier.width(if (index == backgroundIndex) 16.dp else 5.dp).height(5.dp).clip(RoundedCornerShape(50)).background(if (index == backgroundIndex) FocusGold else White.copy(alpha = .45f)))
                }
            }
        }
        LazyRow(
            Modifier.fillMaxWidth().focusGroup().padding(start = 20.dp),
            horizontalArrangement = Arrangement.spacedBy(10.dp),
            contentPadding = PaddingValues(end = 20.dp)
        ) {
            itemsIndexed(categoryDefinitions, key = { _, item -> item.name }) { index, item ->
                CategoryCard(item, index == selectedCategoryIndex, {
                    selectedCategoryIndex = index
                    selectedSubcategory = item.subcategories.first()
                }, menuRequester)
            }
        }

        Box(Modifier.fillMaxWidth().weight(1f).clip(RoundedCornerShape(14.dp, 14.dp, 0.dp, 0.dp))) {
            Crossfade(targetState = backgrounds[backgroundIndex], animationSpec = tween(1100), label = "category-background") { res ->
                Image(painter = painterResource(id = res), contentDescription = "${category.name} background", contentScale = ContentScale.Crop, modifier = Modifier.fillMaxSize())
            }
            Box(Modifier.fillMaxSize().background(Brush.verticalGradient(listOf(Bg.copy(alpha = .70f), Bg.copy(alpha = .55f), Bg.copy(alpha = .82f)))))
            Column(Modifier.fillMaxSize().padding(start = 20.dp, top = 8.dp, bottom = 10.dp)) {
                Row(verticalAlignment = Alignment.CenterVertically) {
                    SectionTitle("SUB-CATEGORIAS")
                    Spacer(Modifier.width(10.dp))
                    Text(category.name, color = FocusGold, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                }
                LazyRow(Modifier.fillMaxWidth().focusGroup(), horizontalArrangement = Arrangement.spacedBy(8.dp), contentPadding = PaddingValues(end = 20.dp)) {
                    items(category.subcategories, key = { it }) { sub ->
                        SubcategoryChip(displaySubcategory(sub), sub == selectedSubcategory) { selectedSubcategory = sub }
                    }
                }
                Spacer(Modifier.height(6.dp))
                Row(verticalAlignment = Alignment.CenterVertically) {
                    SectionTitle("CANAIS")
                    Spacer(Modifier.width(10.dp))
                    Text("${category.name} • ${displaySubcategory(selectedSubcategory)}", color = White.copy(alpha = .80f), fontSize = 12.sp, maxLines = 1)
                    Spacer(Modifier.weight(1f))
                    Text("${channels.size} disponíveis", color = White.copy(alpha = .72f), fontSize = 11.sp)
                }
                Spacer(Modifier.height(2.dp))
                if (channels.isEmpty()) {
                    Box(Modifier.fillMaxWidth().height(70.dp).padding(end = 20.dp).clip(RoundedCornerShape(12.dp)).background(Surface.copy(alpha = .88f)), contentAlignment = Alignment.CenterStart) {
                        Text("Nenhum canal com fonte disponível nesta subcategoria.", color = White.copy(alpha = .78f), fontSize = 13.sp, modifier = Modifier.padding(horizontal = 16.dp), maxLines = 2)
                    }
                } else {
                    LazyVerticalGrid(
                        columns = GridCells.Adaptive(minSize = 190.dp),
                        modifier = Modifier.fillMaxWidth().weight(1f).focusGroup(),
                        contentPadding = PaddingValues(top = 2.dp, bottom = 20.dp, end = 20.dp),
                        horizontalArrangement = Arrangement.spacedBy(10.dp),
                        verticalArrangement = Arrangement.spacedBy(10.dp)
                    ) {
                        items(channels, key = { it.id }) { channel ->
                            ChannelGridCard(channel, context, firstChannelRequester, channel.id == channels.firstOrNull()?.id)
                        }
                    }
                }
            }
        }
    }
}

@Composable
private fun SectionTitle'''

          s = s[:m.start()] + new_function + s[m.end():]
          p.write_text(s, encoding='utf-8')
          print('Category background scope fixed successfully.')
          PY

      - name: Commit source fix
        shell: bash
        run: |
          git config user.name 'HavilaLearning Bot'
          git config user.email 'actions@github.com'
          if git diff --quiet -- app/src/main/java/com/havila/tv/MainActivity.kt; then
            echo 'No source changes required.'
          else
            git add app/src/main/java/com/havila/tv/MainActivity.kt
            git commit -m 'Fix category background scope below carousel'
            git push origin fix-havila-tv-channels
          fi

      - name: Install Gradle 8.13
        working-directory: .
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        run: |
          gradle --version
          gradle assembleDebug --stacktrace

      - name: Verify APK
        run: test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HavilaTV-category-background-scope-fix
          path: HavilaTV/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
