name: Validate bundled Havila TV hero images

on:
  push:
    branches:
      - havila-tv-mockup-dashboard
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-local-hero-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate local Mozambique hero images
        shell: bash
        run: |
          set -euo pipefail

          asset_dir="HavilaTV/android/app/src/main/res/drawable-nodpi"

          assets=(
            mozambique_ponte.png
            mozambique_fortaleza.png
            mozambique_ilha.png
            mozambique_monumento.png
            mozambique_cfm.png
            mozambique_baia_maputo.png
            mozambique_heritage01.png
            mozambique_heritage02.png
            mozambique_heritage03.png
          )

          for asset in "${assets[@]}"; do
            test -f "$asset_dir/$asset"
            echo "OK: $asset"
          done

          echo "All local hero assets are present."
