name: One-time local hero asset wiring

on:
  push:
    branches:
      - havila-tv-mockup-dashboard

permissions:
  contents: write

jobs:
  wire-local-hero-assets:
    if: ${{ !contains(github.event.head_commit.message, '[hero-assets]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wire local Mozambique hero images
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('HavilaTV/android/app/src/main/java/com/havila/tv/MainActivity.kt')
          text = path.read_text(encoding='utf-8')

          start = text.index('private val heroSlides = listOf(')
          end_marker = '\n\nclass MainActivity'
          end = text.index(end_marker, start)

          replacement = '''private val heroSlides = listOf(
    HeroSlide("Ponte Maputo–Catembe", "mozambique_ponte"),
    HeroSlide("Fortaleza de São Sebastião", "mozambique_fortaleza"),
    HeroSlide("Ilha de Moçambique", "mozambique_ilha"),
    HeroSlide("Estátua de Samora Machel", "mozambique_monumento"),
    HeroSlide("Estação dos CFM – Maputo", "mozambique_cfm"),
    HeroSlide("Baía de Maputo", "mozambique_baia_maputo"),
    HeroSlide("Património de Moçambique", "mozambique_heritage01"),
    HeroSlide("Património histórico de Moçambique", "mozambique_heritage02"),
    HeroSlide("Património e cultura de Moçambique", "mozambique_heritage03")
)'''

          text = text[:start] + replacement + text[end:]

          old_hero = '''@Composable
private fun Hero() {
    var currentIndex by remember { mutableStateOf(0) }'''
          new_hero = '''@Composable
private fun Hero() {
    val context = androidx.compose.ui.platform.LocalContext.current
    var currentIndex by remember { mutableStateOf(0) }'''
          if old_hero not in text:
              raise SystemExit('Hero function header not found')
          text = text.replace(old_hero, new_hero, 1)

          old_image = '''            AsyncImage(
                model = activeSlide.imageUrl,
                contentDescription = activeSlide.title,
                contentScale = ContentScale.Crop,
                modifier = Modifier.fillMaxSize()
            )'''
          new_image = '''            Image(
                painter = painterResource(
                    id = context.resources.getIdentifier(
                        activeSlide.imageUrl,
                        "drawable",
                        context.packageName
                    )
                ),
                contentDescription = activeSlide.title,
                contentScale = ContentScale.Crop,
                modifier = Modifier.fillMaxSize()
            )'''
          if old_image not in text:
              raise SystemExit('Hero AsyncImage block not found')
          text = text.replace(old_image, new_image, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit local hero wiring
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HavilaTV/android/app/src/main/java/com/havila/tv/MainActivity.kt .github/workflows/one-time-local-hero-assets.yml
          git commit -m 'Wire Havila TV local Mozambique hero assets [hero-assets]'
          git push
