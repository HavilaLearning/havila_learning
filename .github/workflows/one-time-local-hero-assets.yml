name: Validate bundled Havila TV hero images

on:
  push:
    branches:
      - havila-tv-mockup-dashboard
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-local-hero-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate local Mozambique hero images
        shell: bash
        run: |
          set -euo pipefail

          asset_dir="HavilaTV/android/app/src/main/res/drawable-nodpi"
          main_activity="HavilaTV/android/app/src/main/java/com/havila/tv/MainActivity.kt"

          assets=(
            mozambique_ponte.png
            mozambique_fortaleza.png
            mozambique_ilha.png
            mozambique_monumento.png
            mozambique_cfm.png
            mozambique_baia_maputo.png
            mozambique_heritage01.png
            mozambique_heritage02.png
            mozambique_heritage03.png
          )

          for asset in "${assets[@]}"; do
            test -f "$asset_dir/$asset"
            echo "OK: $asset"
          done

          grep -q 'mozambique_ponte' "$main_activity"
          grep -q 'mozambique_fortaleza' "$main_activity"
          grep -q 'mozambique_ilha' "$main_activity"
          grep -q 'mozambique_monumento' "$main_activity"
          grep -q 'mozambique_cfm' "$main_activity"
          grep -q 'mozambique_baia_maputo' "$main_activity"
          grep -q 'mozambique_heritage01' "$main_activity"
          grep -q 'mozambique_heritage02' "$main_activity"
          grep -q 'mozambique_heritage03' "$main_activity"

          echo "All local hero assets and references are present."
