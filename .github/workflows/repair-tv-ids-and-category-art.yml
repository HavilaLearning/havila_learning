name: Repair Havila TV IDs and category art

on:
  workflow_dispatch:
  push:
    branches: [fix-havila-tv-channels]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix-havila-tv-channels

      - name: Repair duplicate ID and category artwork bindings
        shell: python
        run: |
          from pathlib import Path

          repo = Path("HavilaTV/android/app/src/main/java/com/havila/tv/ChannelRepository.kt")
          main = Path("HavilaTV/android/app/src/main/java/com/havila/tv/MainActivity.kt")

          # Remove exactly one of the two identical TV Mana 1 catalogue entries.
          s = repo.read_text(encoding="utf-8")
          duplicate = '        c("tv-mana-1", "TV Mana 1", "Gospel", "Religious", "https://w1.manasat.com/tvmana-1/smil:tvmana-1.smil/playlist.m3u8", "https://i.imgur.com/6jNqpTP.png"),\n'
          count = s.count(duplicate)
          if count != 2:
              raise SystemExit(f"Expected exactly 2 identical tv-mana-1 entries, found {count}")
          s = s.replace(duplicate, "", 1)
          repo.write_text(s, encoding="utf-8")

          m = main.read_text(encoding="utf-8")

          # Replace emoji category icons with the already committed WebP-derived
          # Android drawable resources exposed by CategoryDef.logoRes.
          old_card = '''        Text(category.icon, color = if (selected) Color(0xFF10151C) else White, fontSize = 22.sp, fontWeight = FontWeight.Bold, modifier = Modifier.padding(start = 13.dp))\n'''
          new_card = '''        Image(painter = painterResource(id = category.logoRes), contentDescription = category.name, modifier = Modifier.width(76.dp).height(48.dp).padding(start = 8.dp), contentScale = ContentScale.Fit)\n'''
          if m.count(old_card) != 1:
              raise SystemExit("CategoryCard icon anchor not found exactly once")
          m = m.replace(old_card, new_card, 1)

          # Use the five category-specific WebP backgrounds already committed in
          # drawable, without changing the Home hero/header area.
          old_bg = '''private fun categoryBackgrounds(category: CategoryDefinition): List<Int> {\n    val all = listOf(R.drawable.mozambique_baia_maputo, R.drawable.mozambique_cfm, R.drawable.mozambique_fortaleza, R.drawable.mozambique_ilha, R.drawable.mozambique_monumento, R.drawable.mozambique_ponte, R.drawable.mozambique_heritage01, R.drawable.mozambique_heritage02, R.drawable.mozambique_heritage03)\n    val offset = categoryDefinitions.indexOfFirst { it.name == category.name }.coerceAtLeast(0)\n    return List(5) { all[(offset + it) % all.size] }\n}\n'''
          new_bg = '''private fun categoryBackgrounds(category: CategoryDefinition): List<Int> = when (category.name) {\n    "Notícias" -> listOf(R.drawable.noticias_01, R.drawable.noticias_02, R.drawable.noticias_03, R.drawable.noticias_04, R.drawable.noticias_05)\n    "Gospel" -> listOf(R.drawable.gospel_01, R.drawable.gospel_02, R.drawable.gospel_03, R.drawable.gospel_04, R.drawable.gospel_05)\n    "Desporto" -> listOf(R.drawable.desporto_01, R.drawable.desporto_02, R.drawable.desporto_03, R.drawable.desporto_04, R.drawable.desporto_05)\n    "Filmes" -> listOf(R.drawable.filmes_01, R.drawable.filmes_02, R.drawable.filmes_03, R.drawable.filmes_04, R.drawable.filmes_05)\n    "Havila Kids" -> listOf(R.drawable.havila_kids_01, R.drawable.havila_kids_02, R.drawable.havila_kids_03, R.drawable.havila_kids_04, R.drawable.havila_kids_05)\n    "Música" -> listOf(R.drawable.musica_01, R.drawable.musica_02, R.drawable.musica_03, R.drawable.musica_04, R.drawable.musica_05)\n    "Família" -> listOf(R.drawable.familia_01, R.drawable.familia_02, R.drawable.familia_03, R.drawable.familia_04, R.drawable.familia_05)\n    else -> listOf(R.drawable.mozambique_baia_maputo)\n}\n'''
          if m.count(old_bg) != 1:
              raise SystemExit("Old category background function not found exactly once")
          m = m.replace(old_bg, new_bg, 1)
          main.write_text(m, encoding="utf-8")

      - name: Commit repairs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HavilaTV/android/app/src/main/java/com/havila/tv/ChannelRepository.kt HavilaTV/android/app/src/main/java/com/havila/tv/MainActivity.kt
          git diff --cached --quiet && exit 0
          git commit -m "Fix TV Mana ID and category artwork"
          git push origin HEAD:fix-havila-tv-channels
