name: Repair Havila TV IDs and category art

on:
  workflow_dispatch:
  push:
    branches: [fix-havila-tv-channels]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix-havila-tv-channels

      - name: Repair duplicate IDs and category artwork bindings
        shell: python
        run: |
          from pathlib import Path
          import re

          repo = Path("HavilaTV/android/app/src/main/java/com/havila/tv/ChannelRepository.kt")
          main = Path("HavilaTV/android/app/src/main/java/com/havila/tv/MainActivity.kt")

          # Preserve every channel. If an ID is repeated, rename only later
          # occurrences deterministically; never delete a channel entry.
          s = repo.read_text(encoding="utf-8")
          entry_re = re.compile(r'^(\s*c\(\s*")([^"]+)("\s*,.*)$', re.M)
          seen = set()
          counters = {}
          duplicates = []

          def repair_id(match):
              prefix, channel_id, suffix = match.groups()
              if channel_id not in seen:
                  seen.add(channel_id)
                  counters[channel_id] = 1
                  return match.group(0)
              counters[channel_id] += 1
              new_id = f"{channel_id}-{counters[channel_id]}"
              while new_id in seen:
                  counters[channel_id] += 1
                  new_id = f"{channel_id}-{counters[channel_id]}"
              seen.add(new_id)
              duplicates.append((channel_id, new_id))
              return prefix + new_id + suffix

          s = entry_re.sub(repair_id, s)
          repo.write_text(s, encoding="utf-8")

          print(f"Channel ID repairs applied: {len(duplicates)}")
          for old_id, new_id in duplicates:
              print(f"  {old_id} -> {new_id}")

          m = main.read_text(encoding="utf-8")

          # Replace emoji category icons with the committed drawable logos.
          old_card = '''        Text(category.icon, color = if (selected) Color(0xFF10151C) else White, fontSize = 22.sp, fontWeight = FontWeight.Bold, modifier = Modifier.padding(start = 13.dp))
'''
          new_card = '''        Image(painter = painterResource(id = category.logoRes), contentDescription = category.name, modifier = Modifier.width(76.dp).height(48.dp).padding(start = 8.dp), contentScale = ContentScale.Fit)
'''
          if old_card in m:
              m = m.replace(old_card, new_card, 1)

          # Category backgrounds are scoped to CategoryContent only. The Home
          # hero/header is not modified by this binding.
          old_bg = '''private fun categoryBackgrounds(category: CategoryDefinition): List<Int> {
    val all = listOf(R.drawable.mozambique_baia_maputo, R.drawable.mozambique_cfm, R.drawable.mozambique_fortaleza, R.drawable.mozambique_ilha, R.drawable.mozambique_monumento, R.drawable.mozambique_ponte, R.drawable.mozambique_heritage01, R.drawable.mozambique_heritage02, R.drawable.mozambique_heritage03)
    val offset = categoryDefinitions.indexOfFirst { it.name == category.name }.coerceAtLeast(0)
    return List(5) { all[(offset + it) % all.size] }
}
'''
          new_bg = '''private fun categoryBackgrounds(category: CategoryDefinition): List<Int> = when (category.name) {
    "Notícias" -> listOf(R.drawable.noticias_01, R.drawable.noticias_02, R.drawable.noticias_03, R.drawable.noticias_04, R.drawable.noticias_05)
    "Gospel" -> listOf(R.drawable.gospel_01, R.drawable.gospel_02, R.drawable.gospel_03, R.drawable.gospel_04, R.drawable.gospel_05)
    "Desporto" -> listOf(R.drawable.desporto_01, R.drawable.desporto_02, R.drawable.desporto_03, R.drawable.desporto_04, R.drawable.desporto_05)
    "Filmes e Séries" -> listOf(R.drawable.filmes_01, R.drawable.filmes_02, R.drawable.filmes_03, R.drawable.filmes_04, R.drawable.filmes_05)
    "Havila Kids" -> listOf(R.drawable.havila_kids_01, R.drawable.havila_kids_02, R.drawable.havila_kids_03, R.drawable.havila_kids_04, R.drawable.havila_kids_05)
    "Música e Entretenimento" -> listOf(R.drawable.musica_01, R.drawable.musica_02, R.drawable.musica_03, R.drawable.musica_04, R.drawable.musica_05)
    "Família e Cultura" -> listOf(R.drawable.familia_01, R.drawable.familia_02, R.drawable.familia_03, R.drawable.familia_04, R.drawable.familia_05)
    else -> listOf(R.drawable.mozambique_baia_maputo)
}
'''
          if old_bg in m:
              m = m.replace(old_bg, new_bg, 1)

          main.write_text(m, encoding="utf-8")

      - name: Verify repaired catalogue before commit
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("HavilaTV/android/app/src/main/java/com/havila/tv/ChannelRepository.kt")
          s = p.read_text(encoding="utf-8")
          entries = re.findall(r'^\s*c\(\s*"([^"]+)"\s*,\s*"([^"]*)"\s*,\s*"([^"]*)"\s*,\s*"([^"]*)"\s*,\s*"([^"]*)"\s*(?:,\s*"([^"]*)")?\s*\)', s, re.M)
          ids = [x[0] for x in entries]
          if not entries:
              raise SystemExit("No canonical channel entries found")
          duplicates = sorted({x for x in ids if ids.count(x) > 1})
          missing_names = [x[0] for x in entries if not x[1].strip()]
          missing_streams = [x[0] for x in entries if not x[4].strip()]
          print(f"Complete catalog entries: {len(entries)}")
          print(f"Unique channel IDs: {len(set(ids))}")
          print(f"Entries with stream URL: {len(entries) - len(missing_streams)}")
          print(f"Entries with direct logo URL: {sum(bool(x[5].strip()) for x in entries)}")
          print(f"Entries using category-logo fallback: {sum(not bool(x[5].strip()) for x in entries)}")
          if duplicates:
              raise SystemExit("Duplicate IDs remain: " + ", ".join(duplicates))
          if missing_names:
              raise SystemExit("Blank channel name found: " + ", ".join(missing_names))
          if missing_streams:
              raise SystemExit("Missing stream URL: " + ", ".join(missing_streams))

      - name: Commit repairs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HavilaTV/android/app/src/main/java/com/havila/tv/ChannelRepository.kt HavilaTV/android/app/src/main/java/com/havila/tv/MainActivity.kt
          git diff --cached --quiet && exit 0
          git commit -m "Repair TV channel IDs and category artwork"
          git push origin HEAD:fix-havila-tv-channels
