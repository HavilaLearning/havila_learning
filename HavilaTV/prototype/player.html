<!doctype html>
<html lang="pt-MZ">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Havila TV — Player</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050b13;color:#fff;font-family:Arial,sans-serif;height:100vh;overflow:hidden}.player{height:100vh;display:flex;flex-direction:column}.top{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 42px;background:#081525}.brand{font-size:27px;font-weight:800;letter-spacing:1px}.brand span{color:#e8b84b}.back{color:#cbd5df}.screen{flex:1;display:flex;align-items:center;justify-content:center;background:#000;position:relative}.screen video{width:100%;height:100%;object-fit:contain}.placeholder{text-align:center;color:#9eacb8}.placeholder .play{font-size:70px;margin-bottom:10px}.placeholder h1{margin:0 0 8px}.placeholder p{margin:0}.controls{height:82px;background:#081525;padding:14px 42px;display:flex;align-items:center;gap:20px}.button{border:2px solid transparent;background:#14273d;border-radius:8px;padding:10px 18px;font-size:16px}.button:focus{border-color:#e8b84b;outline:none}.channel{font-size:18px;font-weight:700;margin-left:auto}.status{color:#aebdca;font-size:13px}
</style></head><body><div class="player"><header class="top"><div class="brand">HAVILA <span>TV</span></div><div class="back">‹ Voltar</div></header><main class="screen"><div class="placeholder"><div class="play">▶</div><h1 id="channel">Canal de demonstração</h1><p id="message">O player está preparado para receber um stream HLS autorizado.</p></div></main><footer class="controls"><button class="button" id="play">▶ Reproduzir</button><button class="button" id="mute">🔊 Som</button><span class="status">HLS • Havila TV 1.0</span><span class="channel" id="category">Gospel</span></footer></div><script>const params=new URLSearchParams(location.search);document.getElementById('channel').textContent=params.get('channel')||'Canal de demonstração';document.getElementById('category').textContent=params.get('category')||'Gospel';document.getElementById('play').focus();document.getElementById('play').addEventListener('click',()=>document.getElementById('message').textContent='Quando adicionarmos um stream HLS autorizado, a reprodução começará aqui.');document.addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='Backspace')history.back()});</script></body></html>
